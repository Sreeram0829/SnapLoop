<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Social Media App</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/post.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
  <div class="logo">
    <img src="http://localhost:5000/uploads/logo.jpg" alt="Logo" class="logo-img" />
    <h1>SnapLoop</h1>
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Search..." />
    <button><i class="fas fa-search"></i></button>
  </div>

  <nav class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i></a>
    <a href="#"><i class="fas fa-envelope"></i></a>
    <a href="profile.html"><i class="fas fa-user"></i></a>
    <a href="post.html" class="active"><i class="fas fa-plus"></i></a>
  </nav>
</header>


    <!-- Main Post Content -->
    <main class="main-content">
      <div class="post-page">
        <h2>Create a New Post</h2>
        <form id="postForm" class="post-form" enctype="multipart/form-data">
          <textarea id="postContent" placeholder="What's on your mind?" required></textarea>

          <div class="media-select">
            <label for="postType">Post Type:</label>
            <select id="postType" required>
              <option value="image">Image</option>
              <option value="reel">Reel</option>
              <option value="video">Video</option>
            </select>
          </div>

          <div class="media-select">
            <label for="postMedia">Upload Media:</label>
            <input type="file" id="postMedia" accept="image/*,video/*" required />
          </div>

          <button type="submit"><i class="fas fa-paper-plane"></i> Post</button>
          <div id="postStatus"></div>
        </form>
      </div>
    </main>
  </div>

  <!-- Post Submit Logic -->
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'auth.html';

    const postForm = document.getElementById('postForm');
    const postStatus = document.getElementById('postStatus');

    postForm.onsubmit = async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('content', document.getElementById('postContent').value);
      formData.append('type', document.getElementById('postType').value);
      formData.append('media', document.getElementById('postMedia').files[0]);

      try {
        const res = await fetch('http://localhost:5000/api/posts', {
          method: 'POST',
          headers: {
            'x-auth-token': token
          },
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.msg || 'Failed to upload');

        postStatus.textContent = '✅ Post uploaded successfully!';
        postStatus.style.color = 'green';
        postForm.reset();
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      } catch (err) {
        postStatus.textContent = `❌ ${err.message}`;
        postStatus.style.color = 'red';
      }
    };
  </script>
</body>
</html>
