<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth | SocialApp</title>
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="auth-container">
    <!-- LOGIN CARD -->
    <div class="auth-card" id="loginCard">
      <h1>Welcome to SnapLoop</h1>
      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="Password" required />
          <i class="fas fa-eye toggle-password" data-target="loginPassword"></i>
        </div>
        <button type="submit">Log In</button>
        <div class="divider"><span>OR</span></div>
        <a href="#" class="fb-login"><i class="fab fa-facebook-square"></i> Log in with Facebook</a>
        <a href="#" class="forgot-password">Forgot password?</a>
        <p class="toggle-auth">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
      </form>
    </div>

    <!-- SIGNUP CARD -->
    <div class="auth-card" id="signupCard" style="display: none;">
      <h1>Create Account</h1>
      <form id="signupForm" class="auth-form">
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="text" id="signupUsername" placeholder="Username" required />
        <input type="text" id="signupFullName" placeholder="Full Name" />
        <div class="password-wrapper">
          <input type="password" id="signupPassword" placeholder="Password" required />
          <i class="fas fa-eye toggle-password" data-target="signupPassword"></i>
        </div>
        <div class="password-wrapper">
          <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required />
          <i class="fas fa-eye toggle-password" data-target="signupConfirmPassword"></i>
        </div>
        <button type="submit">Sign Up</button>
        <div class="divider"><span>OR</span></div>
        <a href="#" class="fb-login"><i class="fab fa-facebook-square"></i> Sign up with Facebook</a>
        <p class="toggle-auth">Already have an account? <a href="#" id="showLogin">Log in</a></p>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
